// Plain text → simple HTML that pastes cleanly into Google Docs (bullets become a real list)
function bodyHtml(body){
  return body.split(/\n{2,}/).map(block=>{
    const lines = block.split('\n');
    if(lines.length===1 && DRAFT_HEADINGS.has(lines[0])) return `<h3>${esc(lines[0])}</h3>`;
    if(lines.every(l=>l.startsWith('• '))) return '<ul>'+lines.map(l=>`<li>${linkLine(l.slice(2))}</li>`).join('')+'</ul>';
    return '<p>'+lines.map(linkify).join('<br>')+'</p>';
  }).join('');
}
// "Title: https://…" becomes a titled link; any other bare URL becomes clickable
function linkLine(t){
  const m = t.match(/^(.+?):\s+(https?:\/\/\S+)$/);
  return m ? `<a href="${esc(m[2])}">${esc(m[1])}</a>` : linkify(t);
}
function linkify(t){ return esc(t).replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u}">${u}</a>`); }

/* ===== Documents library: one click adds a link to the email ===== */
const DOC_HEAD = 'For your reference:';
function docsBlock(sel){
  const ds = S.docs.filter(d=>sel.has(d.id));
  return ds.length ? `${DOC_HEAD}\n\n${ds.map(d=>`• ${d.title}: ${d.url}`).join('\n')}` : '';
}
// Puts the document links just above the sign-off (or at the end), replacing the previous block if it's still intact
function withDocs(body, sel, prev){
  if(prev && body.includes(prev)) body = body.replace('\n\n'+prev, '').replace(prev, '');
  const blk = docsBlock(sel);
  if(!blk) return {body, blk:''};
  const m = body.match(/\n\n(Warm regards|Warmly|Best regards|Best|With gratitude|Thank you|Thanks),?\n/);
  body = m ? body.slice(0, m.index) + '\n\n' + blk + body.slice(m.index) : body.replace(/\s*$/, '') + '\n\n' + blk;
  return {body, blk};
}
// Chips plus an inline "Manage documents" panel; onChange runs whenever the selection changes
function mountDocs(boxId, sel, onChange){
  const box = $('#'+boxId); if(!box) return;
  const draw = open => {
    box.innerHTML = `<div class="docchips">${S.docs.map(d=>`<button type="button" class="chip docchip ${sel.has(d.id)?'on':''}" data-doc="${d.id}" aria-pressed="${sel.has(d.id)}">${sel.has(d.id)?'✓':'+'} ${esc(d.title)}</button>`).join('') || '<span class="small muted">No documents in the library yet.</span>'}
      <button type="button" class="btn sm" data-dm>${open?'Done':'Manage documents'}</button></div>
      ${open?`<div class="docmgr">
        ${S.docs.map(d=>`<div class="docrow"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a><button type="button" class="btn sm" data-docdel="${d.id}" aria-label="Remove ${esc(d.title)} from the library">Remove</button></div>`).join('') || '<div class="small muted">Nothing here yet.</div>'}
        <div class="docadd">
          <input type="text" id="${boxId}-t" placeholder="Name, e.g. Travel tips (PDF)" aria-label="Document name">
          <input type="url" id="${boxId}-u" placeholder="Paste a Google Drive link" aria-label="Document link">
          <button type="button" class="btn primary sm" data-docadd>Add</button>
        </div>
        <div class="tiny muted" style="margin-top:6px">Check the file's sharing in Drive is set so recipients can open it.</div>
      </div>`:''}`;
    box.querySelectorAll('[data-doc]').forEach(b=>b.onclick = () => { const id=b.dataset.doc; sel.has(id)?sel.delete(id):sel.add(id); onChange(); draw(open); });
    box.querySelector('[data-dm]').onclick = () => draw(!open);
    if(!open) return;
    box.querySelectorAll('[data-docdel]').forEach(b=>b.onclick = async () => {
      const d = S.docs.find(x=>x.id===b.dataset.docdel);
      if(!confirm(`Remove “${d.title}” from the library? The file in Drive isn't touched.`)) return;
      const {error} = await sb.from('ct_documents').delete().eq('id', d.id);
      if(error) return fail(error);
      S.docs = S.docs.filter(x=>x.id!==d.id);
      if(sel.delete(d.id)) onChange();
      draw(true); toast('Removed from the library');
    });
    box.querySelector('[data-docadd]').onclick = async () => {
      const title = $('#'+boxId+'-t').value.trim(), url = $('#'+boxId+'-u').value.trim();
      if(!title) return toast('Give the document a name');
      if(!/^https?:\/\//.test(url)) return toast('Paste a full link starting with https://');
      const sort = S.docs.reduce((n,d)=>Math.max(n, d.sort||0), 0) + 1;
      const {data, error} = await sb.from('ct_documents').insert({workspace_id:S.ws.id, title, url, sort, created_by:ME()}).select().single();
      if(error) return fail(error);
      S.docs.push(data); draw(true); toast(`Added “${title}”`);
    };
  };
  draw(false);
}

function draftBlockHtml(d){
  return `<h2>${esc(d.p.name)}${d.p.org?` — ${esc(d.p.org)}`:''}</h2>
    <p><b>To:</b> ${esc(d.p.email||'(no email on file)')}<br><b>Subject:</b> ${esc(d.subject)}</p>${bodyHtml(d.body)}`;
}
const draftBlockText = d => `${d.p.name}${d.p.org?' — '+d.p.org:''}\nTo: ${d.p.email||'(no email on file)'}\nSubject: ${d.subject}\n\n${d.body}`;
async function copyRich(html, text){
  try{
    if(window.ClipboardItem && navigator.clipboard?.write){
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([text],{type:'text/plain'})})]);
    } else { await navigator.clipboard.writeText(text); }
    return true;
  }catch(e){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e2){ return false; }
  }
}
/* ===== Outlook: one .eml file per draft; X-Unsent makes Outlook open it as a new message ready to send ===== */
function b64utf8(str){ const bytes = new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin).replace(/.{76}(?=.)/g,'$&\r\n'); }
const hdr = v => /^[\x20-\x7e]*$/.test(v) ? v : `=?UTF-8?B?${b64utf8(v).replace(/\r\n/g,'')}?=`;
function emlFor(d){
  const bnd = 'b' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  const html = `<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.45;color:#1f1f1f">${bodyHtml(d.body)}</body></html>`;
  const to = d.p.email ? (d.p.name && !d.test ? `${hdr(d.p.name)} <${d.p.email}>` : d.p.email) : '';
  return [
    `To: ${to}`, `Subject: ${hdr(d.subject)}`, 'X-Unsent: 1', 'MIME-Version: 1.0',
    `Content-Type: multipart/alternative; boundary="${bnd}"`, '',
    `--${bnd}`, 'Content-Type: text/plain; charset="utf-8"', 'Content-Transfer-Encoding: base64', '', b64utf8(d.body), '',
    `--${bnd}`, 'Content-Type: text/html; charset="utf-8"', 'Content-Transfer-Encoding: base64', '', b64utf8(html), '',
    `--${bnd}--`, ''
  ].join('\r\n');
}
function emlName(d){ return `${TEMPLATES[d.tpl].short} - ${d.test ? 'TEST' : d.p.name}`.replace(/[\\/:*?"<>|]+/g,'').trim() + '.eml'; }
function downloadEml(d){
  const url = URL.createObjectURL(new Blob([emlFor(d)], {type:'message/rfc822'}));
  const a = Object.assign(document.createElement('a'), {href:url, download:emlName(d)});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function outlookBlock(drafts){
  return `<div class="hr"></div>
    <h3 style="margin:4px 0 4px;font-size:15px">Or open them in Outlook</h3>
    <p class="small muted" style="margin:0 0 8px">Each file opens in desktop Outlook as a new message, already addressed. Review it, then press Send, or close it and save it to Drafts. When they’re sent, come back and use <b>Mark as sent</b> above.</p>
    <div class="btns" style="margin-bottom:8px"><button class="btn${drafts.length>1?'':' primary'}" data-emlall>${drafts.length>1?`Download all ${drafts.length}`:'Download for Outlook'}</button></div>
    ${drafts.length>1?`<div class="list card">${drafts.map((d,i)=>`<div class="li small" style="align-items:center"><div class="grow"><b>${esc(d.test?'Test copy for you':d.p.name)}</b> <span class="muted">${esc(d.p.email||'no email on file')}</span></div><button class="btn sm" data-eml="${i}">Download</button></div>`).join('')}</div>`:''}
    ${drafts.some(d=>!d.p.email)?'<p class="tiny muted">Drafts with no email on file download without an address.</p>':''}`;
}
function wireOutlook(drafts){
  document.querySelectorAll('[data-eml]').forEach(b=>b.onclick = () => { downloadEml(drafts[+b.dataset.eml]); b.textContent = '✓ Downloaded'; });
  const all = document.querySelector('[data-emlall]');
  if(all) all.onclick = async () => { for(const d of drafts){ downloadEml(d); await new Promise(r=>setTimeout(r, 350)); } toast(`${drafts.length} file${drafts.length>1?'s':''} downloaded — open them from your Downloads folder`); };
}

// Log any number of sent emails with two requests total
async function markSentMany(drafts){
  drafts = drafts.filter(d=>!d.test);   // test copies to yourself are never logged
  if(!drafts.length) return 0;
  const rows = drafts.map(d=>({workspace_id:S.ws.id, person_id:d.p.id, kind:'email', flow:'outbound', occurred_on:today(), summary:`Sent ${TEMPLATES[d.tpl].short} email: "${d.subject}"`, logged_by:ME()}));
  const {data, error} = await sb.from('ct_interactions').insert(rows).select();
  if(error){ fail(error); return 0; }
  S.interactions.unshift(...data);
  const pids = drafts.map(d=>d.p.id).filter(id=>person(id)?.due_date);
  if(pids.length){ const r = await sb.from('ct_people').update({due_date:null}).in('id', pids).select(); if(!r.error) r.data.forEach(row=>{ const k=S.people.findIndex(x=>x.id===row.id); if(k>-1) S.people[k]={...S.people[k], ...row}; }); }
  const ids = drafts.filter(d=>TEMPLATES[d.tpl].moves).flatMap(d=>openCommitsFor(d.p.id).filter(c=>c.status==='committed').map(c=>c.id));
  return updateCommits(ids, {status:'reached_out'});
}

// Two clear steps: copy the drafts, then open a blank Google Doc and paste.
function toGoogleDoc(drafts, titleLine){
  const n = drafts.length, real = drafts.filter(d=>!d.test).length;
  const html = (titleLine?`<h1>${esc(titleLine)}</h1>`:'') + drafts.map(draftBlockHtml).join('<hr>');
  const text = drafts.map(draftBlockText).join('\n\n— — —\n\n');
  const hasBrackets = drafts.some(d=>/\[[^\]]+\]/.test(d.body));
  modal(`${head('Review and send', `${n} draft${n>1?'s':''} · ${esc(TEMPLATES[drafts[0].tpl].label)}`)}
    <ol class="steps">
      <li><button class="btn primary" id="hcopy">Copy the draft${n>1?'s':''}</button> <span class="small muted" id="hcopied"></span></li>
      <li><button class="btn" id="hopen">Open a blank Google Doc</button> <span class="small muted">then click inside it and press <b>⌘V</b> (Mac) or <b>Ctrl+V</b> (Windows)</span></li>
      <li class="small">Review and edit in the doc${hasBrackets?' — fill in anything in <b>[brackets]</b>':''}, then copy each email into your own mail and send it.</li>
      <li><button class="btn" id="hsent">Mark ${real>1?`all ${real}`:'it'} as sent</button> <span class="small muted">after you’ve sent ${real>1?'them':'it'}${real<n?' · the test copy isn\u2019t logged':''}${TEMPLATES[drafts[0].tpl].moves?' — moves untouched commitments to Reached out':''}</span></li>
    </ol>
    ${outlookBlock(drafts)}
    <div class="hr"></div>
    <div class="small muted" style="margin-bottom:6px">Preview of what gets copied:</div>
    <div class="docprev">${html}</div>`);
  wireOutlook(drafts);
  $('#hcopy').onclick = async () => {
    const ok = await copyRich(`<div>${html}</div>`, text);
    $('#hcopied').textContent = ok ? '✓ Copied' : 'Couldn’t copy — select the preview below and copy it by hand';
    if(ok){ $('#hopen').classList.add('primary'); $('#hcopy').classList.remove('primary'); }
  };
  $('#hopen').onclick = () => { if(!window.open('https://docs.new','_blank')) toast('Your browser blocked the new tab — go to docs.new'); };
  $('#hsent').onclick = async () => {
    if(!confirm(`Log ${real>1?`${real} emails`:'this email'} as sent?`)) return;
    const moved = await markSentMany(drafts);
    closeModal(); route(); toast(`Logged ${real}${moved?` · ${moved} moved to Reached out`:''}`);
  };
}

const tplPicker = (cur, name) => `<div class="checks tplpick">${Object.entries(TEMPLATES).map(([k,t])=>`<label><input type="radio" name="${name}" value="${k}" ${k===cur?'checked':''}>${esc(t.label)}</label>`).join('')}</div>`;

function openDraft(pid, tpl, sel){
  tpl = tpl || suggestTemplate(pid);
  sel = sel || autoDocs(tpl);
  const d = draftFor(pid, tpl);
  let blk = '';
  ({body:d.body, blk} = withDocs(d.body, sel, ''));
  modal(`${head('Email draft', esc(d.p.name))}
    <label class="f">Template</label>${tplPicker(tpl,'dtpl')}
    <label class="f" for="dsub">Subject</label><input id="dsub" type="text" value="${esc(d.subject)}">
    <label class="f" for="dbody">Message</label><textarea id="dbody" style="min-height:320px">${esc(d.body)}</textarea>
    <label class="f">Documents</label><div class="small muted">Click to add or remove a link in the message.</div><div id="ddocs"></div>
    <div class="btns" style="margin-top:14px">
      <button class="btn primary" id="ddoc">Review in Google Doc</button>
      <button class="btn" id="dout">Open in Outlook</button>
      <button class="btn" id="dcopy">Copy text</button>
    </div>
    <p class="tiny muted">${d.p.email?`To: ${esc(d.p.email)}`:'No email on file — add one on the person page.'}${/\[[^\]]+\]/.test(d.body)?' · Fill in anything in [brackets].':''}</p>`);
  let dirty = false;
  $('#dbody').oninput = $('#dsub').oninput = () => dirty = true;
  document.querySelectorAll('input[name=dtpl]').forEach(r=>r.onchange = () => {
    if(dirty && !confirm('Switch template? Your edits to this draft will be replaced.')){ document.querySelector(`input[name=dtpl][value=${tpl}]`).checked = true; return; }
    openDraft(pid, r.value, TEMPLATES[r.value].docs ? autoDocs(r.value) : sel);
  });
  mountDocs('ddocs', sel, () => { const r = withDocs($('#dbody').value, sel, blk); $('#dbody').value = r.body; blk = r.blk; });
  const cur = () => ({...d, subject:$('#dsub').value, body:$('#dbody').value});
  $('#ddoc').onclick = () => toGoogleDoc([cur()]);
  $('#dout').onclick = () => { downloadEml(cur()); toast('Downloaded — open the file to get a ready-to-send Outlook message'); };
  $('#dcopy').onclick = async () => { const c = cur(); toast(await copyRich(bodyHtml(c.body), c.body) ? 'Copied' : 'Copy failed — select the text and copy manually'); };
}

// Several people at once → one Google Doc
let BATCH_DOCS = new Set();
let BATCH_TPL = null, BATCH_TEST = false;
function openBatchDrafts(tpl){
  tpl = tpl || 'first';
  if(tpl !== BATCH_TPL){ BATCH_TPL = tpl; if(TEMPLATES[tpl].docs) BATCH_DOCS = autoDocs(tpl); }
  const people = S.people.filter(BATCH_FILTER[tpl]).sort((a,b)=>a.name.localeCompare(b.name));
  const who = {first:'have commitments not yet followed up', nudge:'were contacted but haven’t replied', bigsur: BATCH_INVITE ? 'either committed to Big Sur or haven\u2019t been asked yet (they get the invitation version)' : 'have an open Big Sur commitment', thanks:'have an outcome recorded', prearrival:'are on the Big Sur list. Everyone marked as coming is ticked; people who haven\u2019t confirmed yet are listed unticked'}[tpl];
  modal(`${head('Batch emails')}
    <label class="f">Template</label>${tplPicker(tpl,'btpl')}
    ${tpl==='bigsur'?`<label class="small" style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" id="binvite" ${BATCH_INVITE?'checked':''}> Also invite people from the room who haven\u2019t been asked</label>`:''}
    <p class="small muted">${people.length} ${people.length===1?'person':'people'} ${who}. Tick who to include; the next screen shows every draft and walks you through putting them into one Google Doc.</p>
    ${people.length?`<div class="btns" style="margin-bottom:8px"><button class="btn sm" id="ball">All</button><button class="btn sm" id="bnone">None</button>
      <label class="small" style="display:flex;gap:6px;align-items:center;margin-left:auto"><input type="checkbox" id="bmine"> Only ones I own</label></div>
    <div class="list card" id="blist">${people.map(p=>{ const own = p.owner_email ? [p.owner_email] : [];
      return `<label class="li" style="cursor:pointer" data-owners="${esc(own.join(','))}"><input type="checkbox" value="${p.id}" ${(tpl==='bigsur' && !bigSurCommits(p.id).length) || (tpl==='prearrival' && !(p.bigsur_count>0)) ? '' : 'checked'} style="margin-top:4px"><div class="grow small"><b>${esc(p.name)}</b> · ${esc(p.org||'')}<div class="tiny muted">${tpl==='prearrival' ? (p.bigsur_count>0 ? `Coming${p.bigsur_count>1?` · ${p.bigsur_count} people`:''}` : 'Not confirmed yet') : `${openCommitsFor(p.id).length} open commitment${openCommitsFor(p.id).length===1?'':'s'}`}${own.length?' · '+esc([...new Set(own)].map(ownerName).join(', ')):''}${p.email?'':' · no email'}</div></div></label>`; }).join('')}</div>
    <label class="f">Documents</label><div class="small muted">Links you pick here go into every draft.</div><div id="bdocs"></div>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="btest" ${BATCH_TEST?'checked':''}> Add a test copy addressed to me${ME()?` (${esc(ME())})`:''}, so I can see how it arrives</label>
    <div class="btns" style="margin-top:14px"><button class="btn primary" id="bdoc">Next: prepare drafts</button></div>`
    : '<div class="card pad small muted">No one fits this template right now.</div>'}`);
  document.querySelectorAll('input[name=btpl]').forEach(r=>r.onchange = () => openBatchDrafts(r.value));
  if($('#binvite')) $('#binvite').onchange = e => { BATCH_INVITE = e.target.checked; openBatchDrafts('bigsur'); };
  if(!people.length) return;
  const boxes = () => [...document.querySelectorAll('#blist input')];
  mountDocs('bdocs', BATCH_DOCS, () => {});
  $('#btest').onchange = e => BATCH_TEST = e.target.checked;
  $('#ball').onclick = () => boxes().forEach(b=>b.checked=true);
  $('#bnone').onclick = () => boxes().forEach(b=>b.checked=false);
  $('#bmine').onchange = e => boxes().forEach(b=>{ const owners = b.closest('label').dataset.owners.split(',').filter(Boolean); b.checked = !e.target.checked || owners.includes(ME()); });
  $('#bdoc').onclick = () => {
    const ids = boxes().filter(b=>b.checked).map(b=>b.value); if(!ids.length) return toast('Pick at least one person');
    const drafts = ids.map(id=>{ const d = draftFor(id, tpl); d.body = withDocs(d.body, BATCH_DOCS, '').body; return d; });
    if(BATCH_TEST && ME()){
      // A copy of the first draft, greeting and address changed to you; it's listed first and never logged as sent
      const meName = member(ME())?.name || ME(), d0 = drafts[0];
      const body = d0.body.replace(/^(Hi|Dear) [^,\n]+,/, `$1 ${meName.split(' ')[0]},`);
      drafts.unshift({...d0, test:true, body, subject:'[TEST] '+d0.subject, p:{id:null, name:`TEST COPY for ${meName}`, org:'', email:ME()}});
    }
    toGoogleDoc(drafts, `CPTA ${TEMPLATES[tpl].short} emails — ${new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}`);
  };
}

/* ===== Start ===== */
boot();
</script>
